<style>
:root {
  --bg: #0f0608;
  --surface: rgba(15, 6, 8, 0.75);
  --surface2: rgba(30, 10, 14, 0.88);
  --gold: #c9a550;
  --gold-light: #e2c078;
  --julian: #c9a550;
  --mateo: #8b1a2f;
  --leo: #d4c9b0;
  --text: #faf5ee;
  --text-dim: #9e8e82;
}
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── FONDO DE ESCENA ─────────────────────────────────────────────── */
  #scene-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 0.6s ease;
  }
  #scene-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10,7,8,0.55) 0%,
      rgba(10,7,8,0.70) 40%,
      rgba(10,7,8,0.88) 100%
    );
  }
  #scene-bg.no-image {
    background-color: var(--bg);
    background-image: none !important;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  #app {
    position: relative;
    z-index: 10;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .scene {
    display: none;
    animation: fadeIn 0.7s ease forwards;
    padding: 60px 0 80px;
  }
  .scene.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .chapter-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 20px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  }
  .chapter-label span { color: var(--scene-color, var(--gold)); }

  .scene-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 6px;
    color: var(--text);
    text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  }

  .divider {
    width: 48px;
    height: 1px;
    background: var(--scene-color, var(--gold));
    margin: 24px 0;
    opacity: 0.6;
  }

  .scene-body {
    font-size: 18px;
    line-height: 1.85;
    color: #d4c8be;
    font-weight: 300;
    margin-bottom: 40px;
    font-style: italic;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
    background: rgba(10,7,8,0.45);
    padding: 20px 24px;
    backdrop-filter: blur(2px);
  }

  .choices-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .choices { display: flex; flex-direction: column; gap: 10px; }

  .choice-btn {
    background: var(--surface);
    border: 1px solid rgba(201,169,110,0.15);
    color: var(--text);
    padding: 18px 24px;
    text-align: left;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 300;
    line-height: 1.5;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .choice-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--scene-color, var(--gold));
    transform: scaleY(0);
    transition: transform 0.25s ease;
  }
  .choice-btn:hover {
    background: var(--surface2);
    border-color: rgba(201,169,110,0.4);
    padding-left: 32px;
  }
  .choice-btn:hover::before { transform: scaleY(1); }

  .choice-letter {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--scene-color, var(--gold));
    display: block;
    margin-bottom: 4px;
    opacity: 0.8;
  }

  .final-scene .scene-title { font-size: clamp(32px, 6vw, 52px); }

  .final-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--scene-color, var(--gold));
    border: 1px solid var(--scene-color, var(--gold));
    padding: 6px 14px;
    margin-bottom: 28px;
    opacity: 0.85;
  }

  .restart-btn {
    margin-top: 48px;
    background: transparent;
    border: 1px solid rgba(201,169,110,0.3);
    color: var(--text-dim);
    padding: 14px 28px;
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .restart-btn:hover { border-color: var(--gold); color: var(--gold); }

  .intro-scene { text-align: center; }
  .intro-scene .ornament {
    color: var(--gold); font-size: 28px; opacity: 0.5;
    margin-bottom: 32px; display: block;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  }
  .intro-scene .scene-title { font-size: clamp(36px, 7vw, 60px); }
  .intro-subtitle {
    font-size: 16px; color: var(--text-dim); font-style: italic;
    margin-bottom: 48px; letter-spacing: 0.05em;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }

  .character-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 40px 0 48px;
    text-align: left;
  }
  .char-card {
    background: rgba(13,10,9,0.7);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 20px 16px;
    backdrop-filter: blur(6px);
    transition: all 0.3s;
  }
  .char-card:hover { transform: translateY(-4px); border-color: var(--char-color); }
  .char-card .char-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px; color: var(--char-color); margin-bottom: 6px;
  }
  .char-card .char-role { font-size: 12px; color: var(--text-dim); font-style: italic; }

  .start-btn {
    background: var(--gold); color: #0a0708; border: none;
    padding: 16px 48px;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px; font-weight: 500; letter-spacing: 0.3em;
    text-transform: uppercase; cursor: pointer; transition: all 0.3s;
  }
  .start-btn:hover { background: var(--gold-light); transform: translateY(-2px); }

  .trail {
    position: fixed; top: 0; left: 0; right: 0;
    height: 2px; background: rgba(255,255,255,0.05); z-index: 100;
  }
  .trail-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.5s ease, background 0.5s ease;
    width: 0%;
  }

  @media (max-width: 480px) {
    .character-cards { grid-template-columns: 1fr; }
    .scene { padding: 40px 0 60px; }
  }
</style>
</head>

  },
  D7: {
    id: 'FINAL C2', color: 'leo', type: 'final', badge: 'Final Leo · C2',
    title: 'Viajas sola y renaces',
    body: 'Compraste un boleto. Destino: el que querías desde hace años pero nunca priorizaste. Sin Julián, sin Mateo, sin Leo. Solo tú y la versión de ti misma que ninguno de los tres llegó a conocer.'
  },
  X: {
    id: 'FINAL MIXTO', color: 'gold', type: 'final', badge: 'Final Mixto',
    title: 'Nuevo triángulo amoroso',
    body: 'Abriste esa puerta y detrás encontraste exactamente lo que temías - y lo que secretamente querías. El triángulo que pensabas cerrado se dibuja de nuevo, esta vez con tres personas que ya saben cómo duele. Y aun así, empiezan.'
  }
};

const COLORS = { gold:'var(--gold)', julian:'var(--julian)', mateo:'var(--mateo)', leo:'var(--leo)' };
const PROGRESS = {
  intro:0, A:5,
  B:15, B2:22, B3:30, B4:38, B5:46, B6:100, B7:100, B8:100,
  C:15, C2:22, C3:30, C4:38, C5:46, C6:100, C7:100,
  D:15, D2:22, D3:30, D4:38, D5:46, D6:100, D7:100, X:100
};

function getColor(key) { return COLORS[key] || COLORS.gold; }

function setBackground(id) {
  const bg = document.getElementById('scene-bg');
  const img = IMAGENES[id];
  if (img && img.trim() !== '') {
    bg.style.backgroundImage = `url('${img}')`;
    bg.classList.remove('no-image');
  } else {
    bg.style.backgroundImage = 'none';
    bg.classList.add('no-image');
  }
}

function renderIntro() {
  return `
    <div class="scene active intro-scene">
      <span class="ornament">✦</span>
      <div class="scene-title">Entre Tres Mundos</div>
      <p class="intro-subtitle">Una noche de lujo, cámaras y secretos.<br>Tres hombres aparecen en tu destino.</p>
      <div class="divider" style="margin:0 auto 40px;"></div>
      <div class="character-cards">
        <div class="char-card" style="--char-color:var(--julian)">
          <div class="char-name">Julián</div>
          <div class="char-role">Magnate poderoso</div>
        </div>
        <div class="char-card" style="--char-color:var(--mateo)">
          <div class="char-name">Mateo</div>
          <div class="char-role">Artista rebelde</div>
        </div>
        <div class="char-card" style="--char-color:var(--leo)">
          <div class="char-name">Leo</div>
          <div class="char-role">Amigo de toda la vida</div>
        </div>
      </div>
      <button class="start-btn" onclick="goTo('A')">Comenzar historia</button>
    </div>`;
}

function renderScene(id) {
  const s = SCENES[id];
  if (!s) return '';
  if (s.type === 'intro') return renderIntro();

  const color = getColor(s.color);
  const isFinal = s.type === 'final';

  const choicesHTML = !isFinal && s.choices ? `
    <div class="choices-label">¿Qué haces?</div>
    <div class="choices">
      ${s.choices.map((c,i) => `
        <button class="choice-btn" onclick="goTo('${c.next}')">
          <span class="choice-letter">Opción ${String.fromCharCode(65+i)}</span>
          ${c.text}
        </button>`).join('')}
    </div>` : '';

  const finalHTML = isFinal ? `
    <div class="final-badge">${s.badge}</div>
    <button class="restart-btn" onclick="goTo('intro')">↩ Volver al inicio</button>` : '';

  return `
    <div class="scene active ${isFinal ? 'final-scene' : ''}" style="--scene-color:${color}">
      <div class="chapter-label">
        ${s.character ? `<span>${s.character}</span> · ` : ''}${s.id}
      </div>
      <h2 class="scene-title">${s.title}</h2>
      <div class="divider"></div>
      <p class="scene-body">${s.body}</p>
      ${isFinal ? finalHTML : choicesHTML}
    </div>`;
}

function goTo(id) {
  document.getElementById('app').innerHTML = renderScene(id);
  setBackground(id);
  const trail = document.getElementById('trail');
  const s = SCENES[id];
  trail.style.width = (PROGRESS[id] ?? 50) + '%';
  trail.style.background = s ? getColor(s.color || 'gold') : 'var(--gold)';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

goTo('intro');
</script>
</body>
</html>
